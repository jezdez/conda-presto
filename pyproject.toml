[build-system]
requires = ["hatchling>=1.12.2", "hatch-vcs>=0.2.0"]
build-backend = "hatchling.build"

[project]
authors = [{ name = "Jannis Leidel", email = "jannis@leidel.info" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
name = "conda-presto"
description = "Resolve, inspect, and cache conda solve results through CLI, HTTP, CI, and solver integrations"
readme = { file = "README.md", content-type = "text/markdown" }
license = "BSD-3-Clause"
keywords = ["conda", "dependency-solving", "environments", "lockfiles", "solver"]
maintainers = [{ name = "Jannis Leidel", email = "jannis@leidel.info" }]
requires-python = ">=3.13"
dependencies = [
    # conda and conda-rattler-solver are supplied by the active conda environment.
    "conda-broker>=0.1.1",
    "msgspec>=0.19",
]
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/jezdez/conda-presto/blob/main/CHANGELOG.md"
Documentation = "https://jezdez.github.io/conda-presto"
Homepage = "https://github.com/jezdez/conda-presto"
Issues = "https://github.com/jezdez/conda-presto/issues"
Repository = "https://github.com/jezdez/conda-presto"

[project.optional-dependencies]
redis = ["redis>=5.0"]

[project.scripts]
conda-presto = "conda_presto.cli:main"

[project.entry-points.conda]
"conda-presto" = "conda_presto.plugin"

[project.entry-points.conda_broker]
"conda-presto" = "conda_presto.broker"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "conda_presto/_version.py"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "FA",
    "I",
    "ISC",
    "T10",
    "UP",
    "W",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v --benchmark-disable --cov=conda_presto --cov-report=term-missing"
markers = ["crossplatform: tests that solve for non-native platforms (deselect with -m 'not crossplatform')"]

[tool.coverage.run]
source = ["conda_presto"]
omit = ["conda_presto/_version.py"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.13,<3.14"
conda = ">=26.5,<27"
conda-rattler-solver = ">=0.1.1,<0.2"
conda-lockfiles = ">=0.2.1"
msgspec = ">=0.19"
setuptools = ">=83"

[tool.pixi.pypi-dependencies]
conda-presto = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.9"

[tool.pixi.feature.test.dependencies]
pytest = ">=8.0"
pytest-benchmark = ">=5.0"
pytest-cov = ">=6.0"
httpx = ">=0.28"
anyio = ">=4.0"
pyyaml = ">=6.0"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=7.0"
conda-sphinx-theme = ">=0.2"
myst-parser = ">=3.0"
sphinx-design = ">=0.6"
sphinx-copybutton = ">=0.5"
sphinxcontrib-mermaid = ">=1.0"

[tool.pixi.feature.server.dependencies]
litestar = ">=2.18"
pyjwt = ">=2.0"
uvicorn = ">=0.34"
brotli-python = ">=1.1"
redis-py = ">=5.0"

[tool.pixi.feature.release.dependencies]
hatch-vcs = ">=0.2.0"
hatchling = ">=1.12.2"
python-build = ">=1.2"
python = ">=3.13,<3.14"
setuptools = ">=83"

[tool.pixi.environments]
dev = { features = ["dev", "server"], solve-group = "default" }
test = { features = ["test", "server"], solve-group = "default" }
prod = { features = ["server"], solve-group = "default" }
redis = { features = ["server"], solve-group = "default" }
cli = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
release = { features = ["release"], no-default-feature = true }

[tool.pixi.activation.env]
CONDA_CHANNEL_PRIORITY = "strict"
CONDA_NO_LOCK = "true"
CONDA_UNSATISFIABLE_HINTS = "false"
CONDA_NUMBER_CHANNEL_NOTICES = "0"
CONDA_AGGRESSIVE_UPDATE_PACKAGES = ""
CONDA_LOCAL_REPODATA_TTL = "300"
CONDA_JSON = "true"
CONDA_SOLVER = "rattler"

[tool.pixi.feature.docs.tasks]
docs = "sphinx-build -b dirhtml docs docs/_build/dirhtml"

[tool.pixi.tasks]
lint = { cmd = "ruff check conda_presto tests", description = "Check code style" }
format = { cmd = "ruff format conda_presto tests", description = "Auto-format code" }
test = { cmd = "pytest", description = "Run tests" }
bench = { cmd = "pytest tests/test_benchmarks.py --benchmark-enable", description = "Run benchmarks" }
serve = { cmd = "uvicorn conda_presto.app:app --reload --no-access-log", description = "Run dev server" }
solve = { cmd = "conda-presto", description = "Run a solve" }
