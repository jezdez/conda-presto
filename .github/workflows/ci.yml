name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.1
          environments: dev
          cache: true
      - run: pixi run -e dev lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.1
          environments: test
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/rattler/cache
          key: repodata-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: repodata-${{ runner.os }}-
      - run: pixi run -e test pytest -m "not crossplatform"
        timeout-minutes: 5

  broker:
    name: Broker lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.1
          environments: test
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/rattler/cache
          key: repodata-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: repodata-${{ runner.os }}-
      - name: Exercise broker readiness
        run: >-
          pixi run -e test conda broker dev test conda-presto.server
          --scenario health --timeout 180 --json
      - name: Exercise broker restart policy
        run: >-
          pixi run -e test conda broker dev test conda-presto.server
          --scenario crash --timeout 180 --json
      - name: Exercise nested worker replacement
        timeout-minutes: 8
        env:
          CONDA_PRESTO_BROKER_LIFECYCLE_TEST: "1"
        run: >-
          pixi run -e test pytest --no-cov
          tests/test_broker.py::test_broker_replaces_service_after_nested_worker_exit
