name: Update lockfile

permissions: {}

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"

concurrency:
  group: update-lockfile
  cancel-in-progress: false

jobs:
  pixi-update:
    name: Update Pixi lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the updated lockfile branch.
      pull-requests: write # Create or update the dependency pull request.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          run-install: false

      - name: Update lockfile
        run: |
          set -euo pipefail
          pixi update --json --no-install | pixi exec -s "pixi-diff-to-markdown>=0.3.9" pixi-diff-to-markdown >> diff.md

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create update-pixi
          git add pixi.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update pixi lockfile"
          gh auth setup-git
          git push --force origin HEAD:update-pixi
          if gh pr view update-pixi --repo "$GH_REPO" >/dev/null 2>&1; then
            gh pr edit update-pixi --repo "$GH_REPO" --title "Update pixi lockfile" --body-file diff.md
          else
            gh pr create --repo "$GH_REPO" --base main --head update-pixi --title "Update pixi lockfile" --body-file diff.md --label dependencies
          fi
