name: Update lockfile

permissions: {}

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"

concurrency:
  group: update-lockfile
  cancel-in-progress: false

jobs:
  update:
    name: Update Pixi lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.1
          run-install: false

      - name: Update lockfile
        run: |
          set -euo pipefail
          pixi update --no-install
          printf "Updates \`%s\` from the constraints in \`%s\`.\n" \
            pixi.lock pyproject.toml > diff.md

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lockfile-update
          path: |
            pixi.lock
            diff.md
          if-no-files-found: error

  create-pull-request:
    name: Create dependency pull request
    needs: [update]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the updated lockfile branch.
      pull-requests: write # Create or update the dependency pull request.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lockfile-update
          path: .

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create update-pixi
          git add pixi.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update pixi lockfile"
          gh auth setup-git
          git push --force origin HEAD:update-pixi
          if gh pr view update-pixi --repo "$GH_REPO" >/dev/null 2>&1; then
            gh pr edit update-pixi --repo "$GH_REPO" --title "Update pixi lockfile" --body-file diff.md
          else
            gh pr create --repo "$GH_REPO" --base main --head update-pixi --title "Update pixi lockfile" --body-file diff.md --label dependencies
          fi
