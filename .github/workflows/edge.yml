name: Edge adapter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Cloudflare adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/cloudflare
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          working-directory: deploy/cloudflare
          enable-cache: true
          cache-dependency-glob: deploy/cloudflare/uv.lock
      - run: npm ci
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run pywrangler deploy --dry-run
      - run: uv run python test/integration.py --channel-host "$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
