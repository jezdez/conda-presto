name: Docker

on:
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - conda_presto/**
      - docker/Dockerfile
      - pixi.lock
      - pyproject.toml
      - README.md
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || '0.0.0' }}

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-server:
    name: Build and run server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          target: server
          build-args: |
            PIXI_ENV=prod
            CONDA_PRESTO_VERSION=${{ env.RELEASE_TAG }}
          load: true
          push: false
          tags: conda-presto:smoke
          cache-from: type=gha,scope=server-smoke
          cache-to: type=gha,mode=max,scope=server-smoke

      - name: Exercise server
        run: |
          docker run --detach --name conda-presto-smoke \
            --publish 127.0.0.1:8000:8000 conda-presto:smoke
          for _ in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' conda-presto-smoke | grep -q true; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          curl --fail --silent --max-time 90 \
            --header 'content-type: application/json' \
            --data '{"specs":["zlib"],"platforms":["linux-64"]}' \
            http://127.0.0.1:8000/resolve \
            | jq --exit-status '.[0].platform == "linux-64" and (.[0].packages | length > 0)'
          worker_pid="$(docker exec conda-presto-smoke sh -c '
            for path in /proc/[0-9]*/cmdline; do
              pid="${path#/proc/}"
              pid="${pid%/cmdline}"
              if test "$pid" != "$$" \
                && grep -aq spawn_main "$path" \
                && grep -Eq "^PPid:[[:space:]]+1$" "/proc/$pid/status"; then
                echo "$pid"
                break
              fi
            done
          ')"
          test -n "$worker_pid"
          docker exec conda-presto-smoke sh -c \
            "grep -aq spawn_main /proc/$worker_pid/cmdline"
          docker exec conda-presto-smoke sh -c "kill -9 $worker_pid"
          unavailable=false
          for _ in {1..30}; do
            http_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8000/health)"
            if test "$http_status" = 503; then
              unavailable=true
              break
            fi
            sleep 1
          done
          test "$unavailable" = true
          for _ in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          curl --fail --silent --max-time 90 \
            --header 'content-type: application/json' \
            --data '{"specs":["xz"],"platforms":["linux-64"]}' \
            http://127.0.0.1:8000/resolve \
            | jq --exit-status '.[0].platform == "linux-64" and (.[0].packages | length > 0)'

      - name: Show server logs
        if: failure()
        run: docker logs conda-presto-smoke || true

      - name: Stop server
        if: always()
        run: docker rm --force conda-presto-smoke || true

  metadata-smoke:
    name: Verify ${{ matrix.flavor }} image metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - flavor: server
            suffix: ""
          - flavor: cli
            suffix: -cli
    steps:
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }},enable=${{ !startsWith(env.RELEASE_TAG, 'v0.') && !startsWith(env.RELEASE_TAG, '0.') }}
            type=raw,value=latest,enable=${{ matrix.flavor == 'server' }}
            type=raw,value=cli,enable=${{ matrix.flavor == 'cli' }}

      - name: Verify test tags
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          if test "$FLAVOR" = server; then
            expected="$(printf '%s\n' \
              "$IMAGE:0.0.0" \
              "$IMAGE:0.0" \
              "$IMAGE:latest")"
          else
            expected="$(printf '%s\n' \
              "$IMAGE:0.0.0-cli" \
              "$IMAGE:0.0-cli" \
              "$IMAGE:cli")"
          fi

          diff -u \
            <(sort <<<"$expected") \
            <(sort <<<"$TAGS")

  build-and-push:
    name: Build and push ${{ matrix.flavor }} image
    if: github.event_name != 'pull_request'
    needs: smoke-server
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the release source.
      packages: write # Publish images to GitHub Container Registry.
    strategy:
      matrix:
        include:
          - flavor: server
            target: server
            pixi_env: prod
            suffix: ""
          - flavor: cli
            target: cli
            pixi_env: cli
            suffix: -cli
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify dispatched release ref
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: test "$GITHUB_REF_NAME" = "$RELEASE_TAG"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }},enable=${{ !startsWith(env.RELEASE_TAG, 'v0.') && !startsWith(env.RELEASE_TAG, '0.') }}
            type=raw,value=latest,enable=${{ matrix.flavor == 'server' }}
            type=raw,value=cli,enable=${{ matrix.flavor == 'cli' }}
            type=sha,prefix=,suffix=${{ matrix.suffix }}

      - name: Verify image tags
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SUFFIX: ${{ matrix.suffix }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          major="${version%%.*}"

          grep -Fxq "$IMAGE:$version$SUFFIX" <<<"$TAGS"
          grep -Fxq "$IMAGE:$minor$SUFFIX" <<<"$TAGS"

          if test "$major" = 0; then
            if grep -Fxq "$IMAGE:$major$SUFFIX" <<<"$TAGS"; then
              echo "Major-zero alias must not be published" >&2
              exit 1
            fi
          else
            grep -Fxq "$IMAGE:$major$SUFFIX" <<<"$TAGS"
          fi

          if test "$FLAVOR" = server; then
            grep -Fxq "$IMAGE:latest" <<<"$TAGS"
            if grep -Fxq "$IMAGE:cli" <<<"$TAGS"; then
              echo "Server metadata contains the CLI alias" >&2
              exit 1
            fi
          else
            grep -Fxq "$IMAGE:cli" <<<"$TAGS"
            if grep -Eq "^$IMAGE:(latest|cli-cli)$" <<<"$TAGS"; then
              echo "CLI metadata contains a reserved server or duplicate CLI alias" >&2
              exit 1
            fi
          fi

          grep -Eq "^$IMAGE:[0-9a-f]{7}$SUFFIX$" <<<"$TAGS"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            PIXI_ENV=${{ matrix.pixi_env }}
            CONDA_PRESTO_VERSION=${{ env.RELEASE_TAG }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}
