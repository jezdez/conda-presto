name: Docker

on:
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - conda_presto/**
      - Dockerfile
      - docker/Dockerfile
      - pixi.lock
      - pyproject.toml
      - README.md
      - .trivyignore.yaml
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event_name == 'pull_request' && '0.0.0' || github.ref_name }}

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-server:
    name: Build and run server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          target: server
          build-args: |
            PIXI_ENV=prod
            CONDA_PRESTO_VERSION=${{ env.RELEASE_TAG }}
          load: true
          push: false
          tags: conda-presto:smoke
          cache-from: type=gha,scope=server-smoke
          cache-to: type=gha,mode=max,scope=server-smoke

      - name: Record all server image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:smoke
          format: sarif
          output: trivy-server-amd64.sarif
          exit-code: "0"
          scanners: vuln

      - name: Upload server vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-server-amd64
          path: trivy-server-amd64.sarif
          if-no-files-found: error

      - name: Enforce fixed server image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:smoke
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

      - name: Exercise server
        run: |
          docker run --detach --name conda-presto-smoke \
            --publish 127.0.0.1:8000:8000 conda-presto:smoke
          for _ in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' conda-presto-smoke | grep -q true; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          curl --fail --silent --max-time 90 \
            --header 'content-type: application/json' \
            --data '{"specs":["zlib"],"platforms":["linux-64"]}' \
            http://127.0.0.1:8000/resolve \
            | jq --exit-status '.[0].platform == "linux-64" and (.[0].packages | length > 0)'
          worker_pid="$(docker exec conda-presto-smoke sh -c '
            for path in /proc/[0-9]*/cmdline; do
              pid="${path#/proc/}"
              pid="${pid%/cmdline}"
              if test "$pid" != "$$" \
                && grep -aq spawn_main "$path" \
                && grep -Eq "^PPid:[[:space:]]+1$" "/proc/$pid/status"; then
                echo "$pid"
                break
              fi
            done
          ')"
          test -n "$worker_pid"
          docker exec conda-presto-smoke sh -c \
            "grep -aq spawn_main /proc/$worker_pid/cmdline"
          docker exec conda-presto-smoke sh -c "kill -9 $worker_pid"
          unavailable=false
          for _ in {1..30}; do
            http_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8000/health)"
            if test "$http_status" = 503; then
              unavailable=true
              break
            fi
            sleep 1
          done
          test "$unavailable" = true
          for _ in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          curl --fail --silent --max-time 90 \
            --header 'content-type: application/json' \
            --data '{"specs":["xz"],"platforms":["linux-64"]}' \
            http://127.0.0.1:8000/resolve \
            | jq --exit-status '.[0].platform == "linux-64" and (.[0].packages | length > 0)'

      - name: Show server logs
        if: failure()
        run: docker logs conda-presto-smoke || true

      - name: Stop server
        if: always()
        run: docker rm --force conda-presto-smoke || true

  smoke-space:
    name: Build and run Space image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          build-args: CONDA_PRESTO_VERSION=0.0.0
          load: true
          push: false
          tags: conda-presto:space-smoke
          cache-from: type=gha,scope=space-smoke
          cache-to: type=gha,mode=max,scope=space-smoke

      - name: Record all Space image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:space-smoke
          format: sarif
          output: trivy-space-amd64.sarif
          exit-code: "0"
          scanners: vuln

      - name: Upload Space vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-space-amd64
          path: trivy-space-amd64.sarif
          if-no-files-found: error

      - name: Enforce fixed Space image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:space-smoke
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

      - name: Exercise Space image
        run: |
          docker run --detach --name conda-presto-space-smoke \
            --publish 127.0.0.1:7860:7860 conda-presto:space-smoke
          for _ in {1..180}; do
            if curl --fail --silent http://127.0.0.1:7860/health >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' conda-presto-space-smoke | grep -q true; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Show Space logs
        if: failure()
        run: docker logs conda-presto-space-smoke || true

      - name: Stop Space image
        if: always()
        run: docker rm --force conda-presto-space-smoke || true

  smoke-cli:
    name: Build and run CLI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          target: cli
          build-args: |
            PIXI_ENV=cli
            CONDA_PRESTO_VERSION=${{ env.RELEASE_TAG }}
          load: true
          push: false
          tags: conda-presto:cli-smoke
          cache-from: type=gha,scope=cli-smoke
          cache-to: type=gha,mode=max,scope=cli-smoke

      - name: Record all CLI image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:cli-smoke
          format: sarif
          output: trivy-cli-amd64.sarif
          exit-code: "0"
          scanners: vuln

      - name: Upload CLI vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-cli-amd64
          path: trivy-cli-amd64.sarif
          if-no-files-found: error

      - name: Enforce fixed CLI image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:cli-smoke
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

      - name: Exercise CLI image
        run: docker run --rm conda-presto:cli-smoke --help >/dev/null

  scan-arm64:
    name: Build and scan arm64 ${{ matrix.flavor }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - flavor: server
            target: server
            pixi_env: prod
          - flavor: cli
            target: cli
            pixi_env: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            PIXI_ENV=${{ matrix.pixi_env }}
            CONDA_PRESTO_VERSION=${{ env.RELEASE_TAG }}
          platforms: linux/arm64
          load: true
          push: false
          tags: conda-presto:${{ matrix.flavor }}-arm64-scan
          cache-from: type=gha,scope=${{ matrix.flavor }}-arm64-scan
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}-arm64-scan

      - name: Record all arm64 ${{ matrix.flavor }} image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:${{ matrix.flavor }}-arm64-scan
          format: sarif
          output: trivy-${{ matrix.flavor }}-arm64.sarif
          exit-code: "0"
          scanners: vuln

      - name: Upload arm64 ${{ matrix.flavor }} vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.flavor }}-arm64
          path: trivy-${{ matrix.flavor }}-arm64.sarif
          if-no-files-found: error

      - name: Enforce fixed arm64 ${{ matrix.flavor }} image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:${{ matrix.flavor }}-arm64-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

  metadata-smoke:
    name: Verify ${{ matrix.flavor }} image metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - flavor: server
            suffix: ""
          - flavor: cli
            suffix: -cli
    steps:
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }},enable=${{ !startsWith(env.RELEASE_TAG, 'v0.') && !startsWith(env.RELEASE_TAG, '0.') }}
            type=raw,value=latest,enable=${{ matrix.flavor == 'server' }}
            type=raw,value=cli,enable=${{ matrix.flavor == 'cli' }}

      - name: Verify test tags
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          if test "$FLAVOR" = server; then
            expected="$(printf '%s\n' \
              "$IMAGE:0.0.0" \
              "$IMAGE:0.0" \
              "$IMAGE:latest")"
          else
            expected="$(printf '%s\n' \
              "$IMAGE:0.0.0-cli" \
              "$IMAGE:0.0-cli" \
              "$IMAGE:cli")"
          fi

          diff -u \
            <(sort <<<"$expected") \
            <(sort <<<"$TAGS")

  build-and-push:
    name: Build and push ${{ matrix.flavor }} image
    if: github.event_name != 'pull_request'
    needs: [smoke-server, smoke-cli, scan-arm64]
    runs-on: ubuntu-latest
    environment: ghcr
    permissions:
      contents: read # Check out the release source.
      packages: write # Publish images to GitHub Container Registry.
    strategy:
      matrix:
        include:
          - flavor: server
            target: server
            pixi_env: prod
            suffix: ""
          - flavor: cli
            target: cli
            pixi_env: cli
            suffix: -cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},suffix=${{ matrix.suffix }},enable=${{ !startsWith(env.RELEASE_TAG, 'v0.') && !startsWith(env.RELEASE_TAG, '0.') }}
            type=raw,value=latest,enable=${{ matrix.flavor == 'server' }}
            type=raw,value=cli,enable=${{ matrix.flavor == 'cli' }}
            type=sha,prefix=,suffix=${{ matrix.suffix }}

      - name: Verify image tags
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SOURCE_COMMIT: ${{ github.sha }}
          SUFFIX: ${{ matrix.suffix }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          major="${version%%.*}"
          short_commit="${SOURCE_COMMIT:0:7}"

          grep -Fxq "$IMAGE:$version$SUFFIX" <<<"$TAGS"
          grep -Fxq "$IMAGE:$minor$SUFFIX" <<<"$TAGS"

          if test "$major" = 0; then
            if grep -Fxq "$IMAGE:$major$SUFFIX" <<<"$TAGS"; then
              echo "Major-zero alias must not be published" >&2
              exit 1
            fi
          else
            grep -Fxq "$IMAGE:$major$SUFFIX" <<<"$TAGS"
          fi

          if test "$FLAVOR" = server; then
            grep -Fxq "$IMAGE:latest" <<<"$TAGS"
            if grep -Fxq "$IMAGE:cli" <<<"$TAGS"; then
              echo "Server metadata contains the CLI alias" >&2
              exit 1
            fi
          else
            grep -Fxq "$IMAGE:cli" <<<"$TAGS"
            if grep -Eq "^$IMAGE:(latest|cli-cli)$" <<<"$TAGS"; then
              echo "CLI metadata contains a reserved server or duplicate CLI alias" >&2
              exit 1
            fi
          fi

          grep -Eq "^$IMAGE:[0-9a-f]{7}$SUFFIX$" <<<"$TAGS"

          for immutable_tag in \
            "$IMAGE:$version$SUFFIX" \
            "$IMAGE:$short_commit$SUFFIX"; do
            if output="$(docker buildx imagetools inspect "$immutable_tag" 2>&1)"; then
              echo "Immutable image tag already exists: $immutable_tag" >&2
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|not found' <<<"$output"; then
              printf '%s\n' "$output" >&2
              echo "Could not verify that image tag is unused: $immutable_tag" >&2
              exit 1
            fi
          done

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: push
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            PIXI_ENV=${{ matrix.pixi_env }}
            CONDA_PRESTO_VERSION=${{ env.RELEASE_TAG }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}

      - name: Save image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not return a valid image digest" >&2
            exit 1
          fi
          mkdir image-digest
          printf '%s\n' "$DIGEST" > "image-digest/$FLAVOR"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.flavor }}-digest
          path: image-digest/${{ matrix.flavor }}
          if-no-files-found: error

  attest-images:
    name: Attest ${{ matrix.flavor }} image
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Store image provenance in GitHub.
      artifact-metadata: write # Create metadata for the attested image.
      contents: read
      id-token: write # Sign image provenance with GitHub's OIDC identity.
      packages: write # Attach provenance to the published image.
    strategy:
      matrix:
        include:
          - flavor: server
            suffix: ""
          - flavor: cli
            suffix: -cli
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.flavor }}-digest
          path: image-digest/

      - name: Read image digest
        id: digest
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          digest="$(cat "image-digest/$FLAVOR")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Artifact does not contain a valid image digest" >&2
            exit 1
          fi
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
