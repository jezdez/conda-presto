name: Docker

on:
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - conda_presto/**
      - Dockerfile
      - pixi.lock
      - pyproject.toml
      - README.md
      - .trivyignore.yaml
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event_name == 'pull_request' && '0.0.0' || github.ref_name }}

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-server:
    name: Build and run server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            CONDA_PRESTO_VERSION=${{ env.RELEASE_TAG }}
          load: true
          push: false
          tags: conda-presto:smoke
          cache-from: type=gha,scope=server-smoke
          cache-to: type=gha,mode=max,scope=server-smoke

      - name: Record all server image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:smoke
          format: sarif
          output: trivy-server-amd64.sarif
          exit-code: "0"
          scanners: vuln

      - name: Upload server vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-server-amd64
          path: trivy-server-amd64.sarif
          if-no-files-found: error

      - name: Enforce fixed server image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:smoke
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

      - name: Exercise server
        run: |
          docker run --detach --name conda-presto-smoke \
            --publish 127.0.0.1:8000:8000 conda-presto:smoke
          for _ in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' conda-presto-smoke | grep -q true; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          curl --fail --silent --max-time 90 \
            --header 'content-type: application/json' \
            --data '{"specs":["zlib"],"platforms":["linux-64"]}' \
            http://127.0.0.1:8000/resolve \
            | jq --exit-status '.[0].platform == "linux-64" and (.[0].packages | length > 0)'
          worker_pid="$(docker exec conda-presto-smoke sh -c '
            for path in /proc/[0-9]*/cmdline; do
              pid="${path#/proc/}"
              pid="${pid%/cmdline}"
              if test "$pid" != "$$" \
                && grep -aq spawn_main "$path" \
                && grep -Eq "^PPid:[[:space:]]+1$" "/proc/$pid/status"; then
                echo "$pid"
                break
              fi
            done
          ')"
          test -n "$worker_pid"
          docker exec conda-presto-smoke sh -c \
            "grep -aq spawn_main /proc/$worker_pid/cmdline"
          docker exec conda-presto-smoke sh -c "kill -9 $worker_pid"
          unavailable=false
          for _ in {1..30}; do
            http_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8000/health)"
            if test "$http_status" = 503; then
              unavailable=true
              break
            fi
            sleep 1
          done
          test "$unavailable" = true
          for _ in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null
          curl --fail --silent --max-time 90 \
            --header 'content-type: application/json' \
            --data '{"specs":["xz"],"platforms":["linux-64"]}' \
            http://127.0.0.1:8000/resolve \
            | jq --exit-status '.[0].platform == "linux-64" and (.[0].packages | length > 0)'

      - name: Show server logs
        if: failure()
        run: docker logs conda-presto-smoke || true

      - name: Stop server
        if: always()
        run: docker rm --force conda-presto-smoke || true

  scan-arm64:
    name: Build and scan arm64 server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            CONDA_PRESTO_VERSION=${{ env.RELEASE_TAG }}
          platforms: linux/arm64
          load: true
          push: false
          tags: conda-presto:server-arm64-scan
          cache-from: type=gha,scope=server-arm64-scan
          cache-to: type=gha,mode=max,scope=server-arm64-scan

      - name: Record all arm64 server image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:server-arm64-scan
          format: sarif
          output: trivy-server-arm64.sarif
          exit-code: "0"
          scanners: vuln

      - name: Upload arm64 server vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-server-arm64
          path: trivy-server-arm64.sarif
          if-no-files-found: error

      - name: Enforce fixed arm64 server image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: conda-presto:server-arm64-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml

  metadata-smoke:
    name: Verify server image metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ !startsWith(env.RELEASE_TAG, 'v0.') && !startsWith(env.RELEASE_TAG, '0.') }}
            type=raw,value=latest

      - name: Verify test tags
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          expected="$(printf '%s\n' \
            "$IMAGE:0.0.0" \
            "$IMAGE:0.0" \
            "$IMAGE:latest")"

          diff -u \
            <(sort <<<"$expected") \
            <(sort <<<"$TAGS")

  build-and-push:
    name: Build and push server image
    if: github.event_name != 'pull_request'
    needs: [smoke-server, scan-arm64]
    runs-on: ubuntu-latest
    environment: ghcr
    permissions:
      contents: read # Check out the release source.
      packages: write # Publish images to GitHub Container Registry.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ !startsWith(env.RELEASE_TAG, 'v0.') && !startsWith(env.RELEASE_TAG, '0.') }}
            type=raw,value=latest
            type=sha,prefix=

      - name: Verify image tags
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SOURCE_COMMIT: ${{ github.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          major="${version%%.*}"
          short_commit="${SOURCE_COMMIT:0:7}"

          grep -Fxq "$IMAGE:$version" <<<"$TAGS"
          grep -Fxq "$IMAGE:$minor" <<<"$TAGS"

          if test "$major" = 0; then
            if grep -Fxq "$IMAGE:$major" <<<"$TAGS"; then
              echo "Major-zero alias must not be published" >&2
              exit 1
            fi
          else
            grep -Fxq "$IMAGE:$major" <<<"$TAGS"
          fi

          grep -Fxq "$IMAGE:latest" <<<"$TAGS"

          grep -Eq "^$IMAGE:[0-9a-f]{7}$" <<<"$TAGS"

          for immutable_tag in \
            "$IMAGE:$version" \
            "$IMAGE:$short_commit"; do
            if output="$(docker buildx imagetools inspect "$immutable_tag" 2>&1)"; then
              echo "Immutable image tag already exists: $immutable_tag" >&2
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|not found' <<<"$output"; then
              printf '%s\n' "$output" >&2
              echo "Could not verify that image tag is unused: $immutable_tag" >&2
              exit 1
            fi
          done

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: push
        with:
          context: .
          file: Dockerfile
          build-args: |
            CONDA_PRESTO_VERSION=${{ env.RELEASE_TAG }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Save image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not return a valid image digest" >&2
            exit 1
          fi
          mkdir image-digest
          printf '%s\n' "$DIGEST" > image-digest/server

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-server-digest
          path: image-digest/server
          if-no-files-found: error

  attest-images:
    name: Attest server image
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Store image provenance in GitHub.
      artifact-metadata: write # Create metadata for the attested image.
      contents: read
      id-token: write # Sign image provenance with GitHub's OIDC identity.
      packages: write # Attach provenance to the published image.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-server-digest
          path: image-digest/

      - name: Read image digest
        id: digest
        run: |
          digest="$(cat image-digest/server)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Artifact does not contain a valid image digest" >&2
            exit 1
          fi
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
