name: Docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "conda_presto/**"
      - "docs/**"
      - "examples/demos/**"
      - "action.yml"
      - "Dockerfile"
      - "entrypoint.sh"
      - "tests/fixtures/sigstore/**"
      - "pyproject.toml"
      - "pixi.lock"
  pull_request:
    paths:
      - "conda_presto/**"
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "docs/**"
      - "examples/demos/**"
      - "action.yml"
      - "Dockerfile"
      - "entrypoint.sh"
      - "tests/fixtures/sigstore/**"
      - "pyproject.toml"
      - "pixi.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.80.0
          environments: docs demos
          cache: true
      - name: Execute and record documentation examples
        run: pixi run --locked -e demos demos
      - name: Build docs
        run: pixi run --locked -e docs docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "docs/_build/dirhtml"

  pages:
    name: Deploy documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [docs]

    permissions:
      contents: read # Read the generated documentation artifact.
      pages: write # Deploy the GitHub Pages artifact.
      id-token: write # Authenticate the GitHub Pages deployment.

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
