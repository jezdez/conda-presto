name: Action

on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-smoke.yml
      - conda_presto/**
      - pyproject.toml
      - pixi.lock
      - tests/test_action.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Write environment file
        run: |
          cat > environment.yml <<'YAML'
          channels:
            - conda-forge
          dependencies:
            - zlib
          YAML

      - name: Resolve locally
        id: local
        uses: ./
        with:
          file: environment.yml
          platforms: linux-64
          output: local-result.json

      - name: Check local result
        env:
          SOLVED: ${{ steps.local.outputs.solved }}
        run: |
          test "$SOLVED" = "true"
          test -s local-result.json
          jq -e '.[0].platform == "linux-64"' local-result.json

      - name: Start remote API stub
        run: |
          python - <<'PY' &
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import json


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != "/health":
                      self.send_error(404)
                      return
                  self._json({"status": "ok"})

              def do_POST(self):
                  if self.path != "/resolve":
                      self.send_error(404)
                      return
                  length = int(self.headers.get("content-length", "0"))
                  self.rfile.read(length)
                  self._json(
                      [
                          {
                              "platform": "linux-64",
                              "packages": [],
                              "error": None,
                          }
                      ]
                  )

              def log_message(self, format, *args):
                  return

              def _json(self, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)


          ThreadingHTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
          PY
          echo "$!" > remote-api.pid
          for _ in {1..30}; do
            if curl -sf http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Resolve remotely
        id: remote
        uses: ./
        with:
          mode: remote
          endpoint: http://127.0.0.1:8765
          specs: zlib
          platforms: linux-64
          output: remote-result.json

      - name: Check remote result
        env:
          SOLVED: ${{ steps.remote.outputs.solved }}
        run: |
          test "$SOLVED" = "true"
          test -s remote-result.json
          jq -e '.[0].platform == "linux-64"' remote-result.json

      - name: Stop remote API stub
        if: always()
        run: |
          if [[ -f remote-api.pid ]]; then
            kill "$(cat remote-api.pid)" || true
          fi
