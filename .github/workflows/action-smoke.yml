name: Action

on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-smoke.yml
      - conda_presto/**
      - pyproject.toml
      - pixi.lock
      - tests/test_action.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Resolve through the HTTP service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.70.1
          environments: prod
          cache: true

      - name: Start the HTTP service
        env:
          CONDA_PRESTO_PLATFORMS: linux-64,osx-arm64
          CONDA_PRESTO_PERSISTENT_WORKER: "1"
          CONDA_NO_LOCK: "false"
        run: |
          pixi run -e prod conda-presto --serve --port 8765 > server.log 2>&1 &
          echo "$!" > server.pid
          for _ in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Write an environment file
        run: |
          cat > environment.yml <<'YAML'
          channels:
            - conda-forge
          dependencies:
            - zlib
          YAML

      - name: Resolve two platforms
        id: native
        uses: ./
        with:
          endpoint: http://127.0.0.1:8765
          file: environment.yml
          platforms: linux-64,osx-arm64
          output: result.json

      - name: Check platform results
        env:
          SOLVED: ${{ steps.native.outputs.solved }}
        run: |
          test "$SOLVED" = true
          jq --exit-status '
            length == 2 and
            (map(.platform) == ["linux-64", "osx-arm64"]) and
            all(.[]; .error == null and any(.packages[]; .name == "zlib"))
          ' result.json

      - name: Export a multiplatform lockfile
        id: lock
        uses: ./
        with:
          endpoint: http://127.0.0.1:8765
          specs: zlib
          platforms: linux-64,osx-arm64
          format: rattler-lock-v6
          output: resolved.lock

      - name: Check exported platforms
        env:
          SOLVED: ${{ steps.lock.outputs.solved }}
        run: |
          test "$SOLVED" = true
          pixi run -e prod python - <<'PYTHON'
          from pathlib import Path
          from ruamel.yaml import YAML

          lock = YAML(typ="safe").load(Path("resolved.lock"))
          assert lock["version"] == 6
          packages = lock["environments"]["default"]["packages"]
          assert set(packages) == {"linux-64", "osx-arm64"}
          assert all(packages.values())
          PYTHON

      - name: Show server log
        if: failure()
        run: cat server.log

      - name: Stop the HTTP service
        if: always()
        run: |
          if test -f server.pid; then
            kill "$(cat server.pid)" || true
          fi
