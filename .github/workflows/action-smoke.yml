name: Action

on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-smoke.yml
      - conda_presto/**
      - pyproject.toml
      - pixi.lock
      - tests/test_action.py
      - demos/action/**
      - demos/workspace/environment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Resolve through the HTTP service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.80.0
          environments: prod
          cache: true

      - name: Start the HTTP service
        env:
          CONDA_PRESTO_PLATFORMS: linux-64,osx-arm64
          CONDA_PRESTO_PERSISTENT_WORKER: "1"
          CONDA_NO_LOCK: "false"
        run: |
          pixi run -e prod conda-presto --serve --port 8765 > server.log 2>&1 &
          echo "$!" > server.pid
          for _ in {1..180}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Use the documented environment and workspace examples
        run: |
          cp demos/workspace/environment.yml environment.yml
          cp demos/action/conda.toml conda.toml

      - name: Resolve two platforms
        id: native
        uses: ./
        with:
          endpoint: http://127.0.0.1:8765
          file: environment.yml
          platforms: linux-64,osx-arm64
          output: result.json

      - name: Check platform results
        env:
          SOLVED: ${{ steps.native.outputs.solved }}
        run: |
          test "$SOLVED" = true
          jq --exit-status '
            length == 2 and
            (map(.platform) == ["linux-64", "osx-arm64"]) and
            all(.[]; .error == null and any(.packages[]; .name == "zlib"))
          ' result.json

      - name: Export a multiplatform lockfile
        id: lock
        uses: ./
        with:
          endpoint: http://127.0.0.1:8765
          specs: zlib
          platforms: linux-64,osx-arm64
          format: rattler-lock-v6
          output: resolved.lock

      - name: Check exported platforms
        env:
          SOLVED: ${{ steps.lock.outputs.solved }}
        run: |
          test "$SOLVED" = true
          pixi run -e prod python - <<'PYTHON'
          from pathlib import Path
          from ruamel.yaml import YAML

          lock = YAML(typ="safe").load(Path("resolved.lock"))
          assert lock["version"] == 6
          packages = lock["environments"]["default"]["packages"]
          assert set(packages) == {"linux-64", "osx-arm64"}
          assert all(packages.values())
          PYTHON

      - name: Lock a named workspace environment
        id: workspace
        uses: ./
        with:
          endpoint: http://127.0.0.1:8765
          file: conda.toml
          environments: test
          platforms: linux-64,osx-arm64
          format: conda-workspaces-lock-v1
          output: conda.lock

      - name: Check workspace lock selection
        env:
          SOLVED: ${{ steps.workspace.outputs.solved }}
        run: |
          test "$SOLVED" = true
          pixi run -e prod python - <<'PYTHON'
          from pathlib import Path
          from ruamel.yaml import YAML

          lock = YAML(typ="safe").load(Path("conda.lock"))
          assert lock["version"] == 1
          assert set(lock["environments"]) == {"test"}
          packages = lock["environments"]["test"]["packages"]
          assert set(packages) == {"linux-64", "osx-arm64"}
          assert all(
              any(ref["conda"].rsplit("/", 1)[-1].startswith("zlib-") for ref in refs)
              for refs in packages.values()
          )
          PYTHON

      - name: Show server log
        if: failure()
        run: cat server.log

      - name: Stop the HTTP service
        if: always()
        run: |
          if test -f server.pid; then
            kill "$(cat server.pid)" || true
          fi
