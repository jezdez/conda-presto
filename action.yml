name: conda-presto
description: Resolve conda environments through an HTTP service
branding:
  icon: package
  color: green

inputs:
  file:
    description: Path to an environment file (environment.yml, pixi.lock, etc.)
    required: false
  specs:
    description: Comma-separated package specs (e.g. "python=3.12,numpy")
    required: false
  channels:
    description: Comma-separated channels (default conda-forge)
    required: false
    default: conda-forge
  platforms:
    description: Comma-separated target platforms (e.g. "linux-64,osx-arm64")
    required: false
  format:
    description: Output format (explicit, environment-yaml, conda-lock-v1, pixi-lock-v6, etc.)
    required: false
  output:
    description: Path to write the response body to
    required: false
  endpoint:
    description: "conda-presto base URL"
    required: true

outputs:
  result:
    description: The response body from conda-presto
    value: ${{ steps.output.outputs.result }}
  solved:
    description: Whether the solve succeeded without errors ("true" or "false")
    value: ${{ steps.output.outputs.solved }}

runs:
  using: composite
  steps:
    - name: Resolve
      id: remote
      shell: bash
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_SPECS: ${{ inputs.specs }}
        INPUT_CHANNELS: ${{ inputs.channels }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
      run: |
        set -euo pipefail

        if [[ -z "${INPUT_ENDPOINT:-}" ]]; then
          echo "::error::Input 'endpoint' is required"
          exit 1
        fi
        loopback_host='^http://(127[.]0[.]0[.]1|localhost)(:[0-9]+)?(/|$)'
        loopback_ipv6='^http://\[::1\](:[0-9]+)?(/|$)'
        if [[ "${INPUT_ENDPOINT}" == https://* ]]; then
          :
        elif [[ "${INPUT_ENDPOINT}" =~ ${loopback_host} ]] \
          || [[ "${INPUT_ENDPOINT}" =~ ${loopback_ipv6} ]]; then
          :
        else
          echo "::error::Input 'endpoint' must use HTTPS unless it is a loopback URL"
          exit 1
        fi

        url="${INPUT_ENDPOINT%/}/resolve"

        body='{}'

        if [[ -n "${INPUT_FILE:-}" ]]; then
          if [[ ! -f "${INPUT_FILE}" ]]; then
            echo "::error::Input file not found"
            exit 1
          fi
          file_basename="$(basename "${INPUT_FILE}")"
          body=$(printf '%s' "${body}" | jq \
            --rawfile file "${INPUT_FILE}" \
            --arg filename "${file_basename}" \
            '. + {file: $file, filename: $filename}')
        fi

        if [[ -n "${INPUT_SPECS:-}" ]]; then
          body=$(printf '%s' "${body}" | jq --arg value "${INPUT_SPECS}" \
            '. + {specs: ($value | split(","))}')
        fi

        if [[ -n "${INPUT_CHANNELS:-}" ]]; then
          body=$(printf '%s' "${body}" | jq --arg value "${INPUT_CHANNELS}" \
            '. + {channels: ($value | split(","))}')
        fi

        if [[ -n "${INPUT_PLATFORMS:-}" ]]; then
          body=$(printf '%s' "${body}" | jq --arg value "${INPUT_PLATFORMS}" \
            '. + {platforms: ($value | split(","))}')
        fi

        if [[ -n "${INPUT_FORMAT:-}" ]]; then
          encoded_format="$(jq --null-input --raw-output \
            --arg format "${INPUT_FORMAT}" '$format | @uri')"
          url="${url}?format=${encoded_format}"
        fi

        echo "::group::conda-presto request"
        echo "endpoint: configured"
        echo "body_fields: $(printf '%s' "${body}" | jq -cr 'keys | join(",")')"
        [[ -n "${INPUT_FORMAT:-}" ]] && echo "format: provided" || echo "format: default"
        echo "::endgroup::"

        tmpout="$(mktemp)"
        if http_code=$(printf '%s' "${body}" \
          | curl --disable --silent --show-error \
            --proto '=http,https' \
            --noproxy '127.0.0.1,localhost,::1' \
            --connect-timeout 10 \
            --max-time 300 \
            --max-filesize 104857600 \
            --output "${tmpout}" \
            --write-out "%{http_code}" \
            --request POST "${url}" \
            --header "Content-Type: application/json" \
            --data-binary @-); then
          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            echo "::error::conda-presto returned HTTP ${http_code}"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "exit_code=1" >> "$GITHUB_OUTPUT"
        fi
        echo "tmpout=${tmpout}" >> "$GITHUB_OUTPUT"

    - name: Process output
      id: output
      if: always()
      shell: bash
      env:
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        REMOTE_EXIT: ${{ steps.remote.outputs.exit_code }}
        REMOTE_TMP: ${{ steps.remote.outputs.tmpout }}
      run: |
        set -euo pipefail

        exit_code="${REMOTE_EXIT:-1}"
        tmpout="${REMOTE_TMP:-}"

        if [[ -z "${tmpout}" || ! -f "${tmpout}" ]]; then
          echo "solved=false" >> "$GITHUB_OUTPUT"
          echo "::error::No output produced"
          exit 1
        fi

        response_body="$(cat "${tmpout}")"
        rm -f "${tmpout}"

        make_delimiter() {
          printf 'CONDA_PRESTO_%s\n' \
            "$(od -An -N16 -tx1 /dev/urandom | tr -d '[:space:]')"
        }

        if [[ "${exit_code}" != "0" ]]; then
          echo "solved=false" >> "$GITHUB_OUTPUT"
          echo "::error::conda-presto did not complete successfully"
        else
          solved="true"
          if [[ -z "${INPUT_FORMAT:-}" ]]; then
            if ! error_count=$(printf '%s\n' "${response_body}" \
              | jq --exit-status 'if type == "array" then [.[] | select(.error != null)] | length else error("expected native result array") end' 2>/dev/null); then
              echo "solved=false" >> "$GITHUB_OUTPUT"
              echo "::error::conda-presto returned an invalid native response"
              exit_code=1
            elif [[ "${error_count}" -gt 0 ]]; then
              solved="false"
              echo "::warning::${error_count} platform(s) had solver errors"
            fi
          fi

          if [[ "${exit_code}" == "0" ]]; then
            echo "solved=${solved}" >> "$GITHUB_OUTPUT"

            if [[ -n "${INPUT_OUTPUT:-}" ]]; then
              printf '%s\n' "${response_body}" > "${INPUT_OUTPUT}"
              echo "::notice::Output written"
            fi

            result_size=${#response_body}
            if [[ ${result_size} -gt 100000 ]]; then
              echo "result=(output too large)" >> "$GITHUB_OUTPUT"
            else
              delimiter="$(make_delimiter)"
              while grep -Fqx "${delimiter}" <<< "${response_body}"; do
                delimiter="$(make_delimiter)"
              done
              {
                echo "result<<${delimiter}"
                printf '%s\n' "${response_body}"
                echo "${delimiter}"
              } >> "$GITHUB_OUTPUT"
            fi
          fi
        fi

        if [[ "${exit_code}" != "0" ]]; then
          exit 1
        fi
