[project]
name = "conda-presto-edge"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "workers-py>=1.17.2",
    "workers-runtime-sdk>=1.8.4",
]
